task_properties:
    validation: HO #HO CV or CT
    kfold: 1 # not used in HO
    ratio:
    - 0.2 #validation ratio
    - 0.1 #test ratio
    stratify: True #Stratify splits according according to graphs' number of nodes
    metrics: #Metrics to track during training
      - torchmetrics.classification.Accuracy
      - torchmetrics.classification.F1Score
      - torchmetrics.classification.AUROC
      - torchmetrics.classification.Precision
      - torchmetrics.classification.Recall
      - torchmetrics.classification.MatthewsCorrCoef
    task: binary #only binary classificaiton tasks implemented
    earlyStoppingLogAll: False #Log all steps of training, beyond early stopping condition
    earlyStoppingMetric: Loss # Accuracy, F1Score, AUROC
    earlyStoppingTarget: Minimize # Define if the earlyStoppingMetric should be maximize or minimized
    earlyStoppingMinChange: 0.0001 #Minimum change in the earlyStoppingMetric to reset the counter
    earlyStoppingPatience: 20 #Minimum number of epochs to activate early stopping
    maxEpoch: 100 #Number of epochs
    batchSize: 256 #Batch size
    num_samples: 1 #Number of random seeds for each combination of hyperparameters
    optimizer: Adam #Optimizer

hyper_parameters:
    cO: #Convolutional layers to be tested
         - GraphConvGIN
        #  - GraphConvGC
        #  - GraphConvGCN
        #  - GraphConvPNA
        #  - GraphConvCheb
        #  - GraphConvARMA
    aF: #Activation Function
        - 'ReLU'
    lr: #learning rate
        # - 0.01
        - 0.001
    nL: #Number of Layers
        # - 2
        - 3
    dE: #Number of units for each hidden layer
        - 32
        # - 64
    wD: #L2 regularization
        - 0.001
        # - 0.0001
    dropout: #dropout probability
        - 0.1
        # - 0.3
    graphNorm: #Usage of graph normalization
        - False
        # - True
    pooling: #Function to generate graph embeddings
        - 'sum'
        # - 'mean'

