task_properties:
    validation: HO #CV or CT
    kfold: 1 # not used in HO
    ratio:
    - 0.2 #validation ratio
    - 0.1 #test ratio
    stratify: True
    metrics: #Metrics to track during training
      - torchmetrics.classification.Accuracy
      - torchmetrics.classification.F1Score
      - torchmetrics.classification.Precision
      - torchmetrics.classification.Recall
      - torchmetrics.classification.MatthewsCorrCoef
    task: binary #only binary classificaiton tasks implemented
    batchSize: 256 #Batch size
    num_samples: 1 #Number of random seeds for each combination of hyperparameters

hyper_parameters:
    cO: 
        - GESN
    num_layers: #number of layers
    - 1
    hidden_features: #number of units for each layer
     - 32
    #  - 64
    iterations: #number of iterations
      - 30
    epsilon: #convergence condition
      - 0.000001 
    bias:
      - 0.1
    init: # "uniform, normal, ring" # type of initializer
      - "uniform"
    rho: #contractivity
      - 0.8
      # - 0.9
    sigma: #if rho is given sigma is not taken into account
      - 1
    scale: #scale of input matrix 
      - 1
      # - 0.5
    alpha: #max, mean, median of graphs spectral radius
      - max
      # - mean
      # - median
    ld: # readout regularizer
      - 0.001
      # - 0.01
    readout: # Specify the readout
      #  - Lasso
      #  - LogisticRegressionL1
       - RidgeRegression

